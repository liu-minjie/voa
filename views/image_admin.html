<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片管理</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #f5f7fa;
      padding: 20px;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .header h1 {
      font-size: 24px;
      color: #333;
    }
    
    .type-tabs {
      display: flex;
      gap: 10px;
    }
    
    .type-tabs button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      background: white;
      color: #666;
      transition: all 0.3s;
    }
    
    .type-tabs button.active {
      background: #4CAF50;
      color: white;
    }
    
    .filter-bar {
      display: flex;
      gap: 20px;
      align-items: center;
      margin-bottom: 20px;
      padding: 15px 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .filter-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .filter-item label {
      font-size: 14px;
      color: #666;
    }
    
    .filter-item select,
    .filter-item input {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
    
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }
    
    .btn-primary {
      background: #4CAF50;
      color: white;
    }
    
    .btn-primary:hover {
      background: #45a049;
    }
    
    .btn-warning {
      background: #ff9800;
      color: white;
    }
    
    .btn-danger {
      background: #f44336;
      color: white;
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .stats-bar {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      padding: 15px 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .stats-bar span {
      font-size: 14px;
      color: #666;
    }
    
    .stats-bar .value {
      font-weight: bold;
      color: #333;
    }
    
    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }
    
    .image-card {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    
    .image-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    
    .image-thumbnail {
      width: 100%;
      height: 180px;
      object-fit: cover;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    
    .image-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .image-thumbnail .no-image {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: #f5f5f5;
      color: #999;
      font-size: 14px;
    }
    
    .image-info {
      padding: 15px;
    }
    
    .image-name {
      font-size: 14px;
      font-weight: 500;
      color: #333;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .image-meta {
      font-size: 12px;
      color: #666;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    .image-meta span {
      background: #f0f0f0;
      padding: 2px 6px;
      border-radius: 4px;
    }
    
    .image-actions {
      display: flex;
      gap: 8px;
    }
    
    .image-actions .btn {
      flex: 1;
      padding: 8px;
      font-size: 12px;
    }
    
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }
    
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
      padding: 15px 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .pagination .btn {
      padding: 8px 16px;
    }
    
    .pagination .page-info {
      font-size: 14px;
      color: #666;
    }
    
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      color: white;
      font-size: 16px;
    }
    
    .preview-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1001;
      cursor: pointer;
    }
    
    .preview-modal.show {
      display: flex;
    }
    
    .preview-modal img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🖼️ 图片管理</h1>
    <div class="type-tabs">
      <button id="tab-gallery" class="active" onclick="switchType('gallery')">相册图片</button>
      <button id="tab-record" onclick="switchType('record')">记录图片</button>
      <button id="tab-dailylog" onclick="switchType('dailylog')">日常日志图片</button>
    </div>
  </div>

  <div class="stats-bar">
    <span><span class="value" id="totalCount">0</span> 张图片</span>
    <span>总大小 <span class="value" id="totalSize">0 KB</span></span>
  </div>

  <div class="filter-bar">
    <div class="filter-item">
      <label>搜索:</label>
      <input type="text" id="searchKeyword" placeholder="文件名关键词" onkeyup="renderImages()" style="width: 150px;">
    </div>
    <button class="btn btn-primary" onclick="refreshList()">🔄 刷新列表</button>
  </div>

  <div class="image-grid" id="imageGrid">
    <div class="empty-state">加载中...</div>
  </div>

  <div class="pagination" id="pagination">
    <button class="btn" id="prevBtn" onclick="changePage(-1)">上一页</button>
    <span class="page-info" id="pageInfo">第 1 页 / 共 1 页</span>
    <button class="btn" id="nextBtn" onclick="changePage(1)">下一页</button>
  </div>

  <div class="loading-overlay" id="loading" style="display: none;">
    <div>处理中...</div>
  </div>

  <div class="preview-modal" id="previewModal" onclick="closePreview()">
    <img id="previewImage" src="" alt="">
  </div>

  <script>
    let images = [];
    let currentType = 'gallery';
    let currentPage = 1;
    let pageSize = 20;
    let totalPages = 1;
    let totalCount = 0;

    function switchType(type) {
      currentType = type;
      currentPage = 1;
      
      // 更新标签状态
      document.querySelectorAll('.type-tabs button').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tab-${type}`).classList.add('active');
      
      loadImages();
    }

    async function loadImages(page = 1) {
      currentPage = page;
      const grid = document.getElementById('imageGrid');
      grid.innerHTML = '<div class="empty-state">加载中...</div>';
      
      try {
        const res = await fetch(`/baby/image/admin/list?type=${currentType}&page=${page}&pageSize=${pageSize}`);
        const data = await res.json();
        
        if (data.success) {
          images = data.data || [];
          totalCount = data.total || 0;
          totalPages = Math.ceil(totalCount / pageSize) || 1;
          
          // 更新统计
          const totalSize = images.reduce((sum, img) => sum + img.size, 0);
          document.getElementById('totalCount').textContent = totalCount;
          document.getElementById('totalSize').textContent = formatSize(totalSize);
          
          renderImages();
          updatePagination();
        } else {
          grid.innerHTML = '<div class="empty-state">加载失败，请刷新重试</div>';
        }
      } catch (err) {
        console.error('加载图片列表失败:', err);
        grid.innerHTML = '<div class="empty-state">加载失败，请刷新重试</div>';
      }
    }

    function getFilteredImages() {
      let filtered = [...images];
      
      // 搜索
      const keyword = document.getElementById('searchKeyword').value.trim().toLowerCase();
      if (keyword) {
        filtered = filtered.filter(img => img.name.toLowerCase().includes(keyword));
      }
      
      return filtered;
    }

    function renderImages() {
      const filtered = getFilteredImages();
      const grid = document.getElementById('imageGrid');
      
      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-state">暂无图片</div>';
        return;
      }
      
      grid.innerHTML = filtered.map(img => {
        const sourceLabel = {
          gallery: '相册',
          record: '记录',
          dailylog: '日志'
        }[img.source];
        
        return `
          <div class="image-card">
            <div class="image-thumbnail" onclick="previewImage('${img.url}')">
              <img src="/baby/image/item/${img.url}?thumb=true" alt="${img.name}" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'no-image\\'>图片不存在</div>';">
            </div>
            <div class="image-info">
              <div class="image-name" title="${img.name}">${escapeHtml(img.name)}</div>
              <div class="image-meta">
                <span>${formatSize(img.size)}</span>
                <span>📅 ${new Date(img.createat).toLocaleDateString()}</span>
                <span>🏷️ ${sourceLabel}</span>
              </div>
              <div class="image-actions">
                <button class="btn" onclick="generateThumbnail('${img.url}')">🖼️ 生成缩略图</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function changePage(delta) {
      const newPage = currentPage + delta;
      if (newPage >= 1 && newPage <= totalPages) {
        loadImages(newPage);
      }
    }

    function updatePagination() {
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const pageInfo = document.getElementById('pageInfo');
      
      prevBtn.disabled = currentPage <= 1;
      nextBtn.disabled = currentPage >= totalPages;
      pageInfo.textContent = `第 ${currentPage} 页 / 共 ${totalPages} 页`;
    }

    function refreshList() {
      loadImages(1);
    }

    function formatSize(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function generateThumbnail(filename) {
      try {
        // 先检查缩略图是否已存在
        const checkRes = await fetch(`/baby/image/check-thumbnail?filename=${encodeURIComponent(filename)}`);
        const checkData = await checkRes.json();

        if (checkData.success && checkData.exists) {
          if (!confirm('缩略图已存在，是否重新生成？')) {
            return;
          }
        }

        showLoading('正在生成缩略图...');

        // 1. 获取原图
        const imageRes = await fetch(`/baby/image/item/${filename}`);
        if (!imageRes.ok) {
          throw new Error('获取原图失败');
        }
        const imageBlob = await imageRes.blob();

        // 2. 在前端生成缩略图
        const thumbBlob = await compressImage(imageBlob, 0.7, 200);

        // 3. 上传缩略图
        const formData = new FormData();
        formData.append('thumb', thumbBlob, filename);
        formData.append('filename', filename);

        const uploadRes = await fetch(`/baby/image/upload-thumbnail`, {
          method: 'POST',
          body: formData
        });

        const data = await uploadRes.json();

        if (data.success) {
          alert('缩略图生成成功！');
          loadImages(currentPage);
        } else {
          alert('缩略图生成失败：' + data.message);
        }
      } catch (err) {
        console.error('生成缩略图失败:', err);
        alert('生成缩略图失败：' + err.message);
      } finally {
        hideLoading();
      }
    }

    // 压缩图片生成缩略图
    function compressImage(file, quality = 0.7, maxWidth = 200) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            // 计算等比例缩放
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            // 导出为 webp 格式的 Blob
            canvas.toBlob((blob) => {
              if (blob) {
                resolve(blob);
              } else {
                reject(new Error('Canvas toBlob 失败'));
              }
            }, 'image/webp', quality);
          };
          img.onerror = () => reject(new Error('图片加载失败'));
        };
        reader.onerror = () => reject(new Error('文件读取失败'));
      });
    }

    function previewImage(url) {
      const modal = document.getElementById('previewModal');
      const img = document.getElementById('previewImage');
      img.src = `/baby/image/item/${url}`;
      modal.classList.add('show');
    }

    function closePreview() {
      document.getElementById('previewModal').classList.remove('show');
    }

    function showLoading(text) {
      const loading = document.getElementById('loading');
      loading.innerHTML = `<div>${text}</div>`;
      loading.style.display = 'flex';
    }

    function hideLoading() {
      document.getElementById('loading').style.display = 'none';
    }

    // 初始化
    loadImages();
  </script>
</body>
</html>
