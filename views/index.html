<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页 | Triple Sense</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --text-main: #2d3436;
            --text-sub: #636e72;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
        }

        .card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 3rem;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.3);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--primary-color);
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-sub);
            font-size: 1rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .nav-links {
            display: grid;
            gap: 12px;
        }

        .link-item {
            text-decoration: none;
            color: white;
            background: var(--primary-color);
            padding: 12px;
            border-radius: 12px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .link-item:hover {
            filter: brightness(1.1);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.3);
        }

        .link-item.outline {
            background: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
        }

        .link-item.outline:hover {
            background: rgba(99, 102, 241, 0.05);
        }

        footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #b2bec3;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">T</div>
        
        <h1>Triple Sense</h1>
        <p>Full-Stack Engineer / AI Enthusiast<br>专注于构建简洁、高效的数字体验</p>

        <nav class="nav-links">
            <a href="#" class="link-item">我的项目</a>
            <a href="#" class="link-item outline">Github</a>
            <a href="#" class="link-item outline">联系我</a>
        </nav>

        <footer>© 2026 Designed with Love</footer>
    </div>

</body>
</html>
