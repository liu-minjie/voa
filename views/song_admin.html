<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>音乐管理</title>
  <link rel="stylesheet" href="/public/css/song_admin.css">
</head>
<body>
  <div class="container">
    <div class="section">
      <div class="search-bar">
        <div class="search-input-wrapper">
          <input type="text" id="searchInput" placeholder="输入文件名搜索..." oninput="handleSearchInput(event)" oncompositionstart="isComposing=true" oncompositionend="handleSearchEnd()">
          <span class="search-clear" id="searchClear" onclick="clearSearch()">×</span>
        </div>
        <button onclick="addSong()">添加</button>
      </div>
      <div class="list-container" id="searchResult">
        <div class="empty">输入关键词搜索音乐文件</div>
      </div>
    </div>

    <div class="section">
      <div class="dir-nav-wrapper"> 
        <div class="dir-nav" id="dirNav">/</div>
        <div style="position: absolute; top: 2px; right: 5px; display: flex; gap: 6px;">
          <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()" title="上传文件">↑</button>
          <input type="file" id="fileInput" multiple style="display:none" onchange="handleFileUpload(this)">
          <button class="btn btn-primary" onclick="showSymlinkModal()" title="创建软链接">→</button>
          <button class="btn btn-primary" onclick="showNewFolderModal()" title="新建文件夹">+</button>
        </div>
      </div>
      
      <div class="list-container" id="dirList">
        <div class="loading">加载中...</div>
      </div>
    </div>
  </div>

  <!-- 音乐播放器 -->
  <div class="player-bar" id="playerBar">
    <div class="player-info">
      <div class="player-title" id="playerTitle">未播放</div>
      <button class="player-close" onclick="closePlayer()">关闭</button>
    </div>
    <div class="player-bottom">
      <div class="player-controls">
        <button class="player-btn" id="playerPlayBtn" onclick="togglePlay()">▶</button>
      </div>
      <div class="player-progress">
        <span class="player-time" id="playerCurrentTime">00:00</span>
        <input type="range" id="playerProgress" min="0" max="100" value="0" oninput="seekTo()">
        <span class="player-time" id="playerTotalTime">00:00</span>
      </div>
    </div>
  </div>

  <audio id="audioPlayer" style="display:none;"></audio>

  <div class="modal" id="renameModal">
    <div class="modal-content">
      <h3 id="modalTitle">重命名</h3>
      <input type="text" id="newNameInput" placeholder="输入新名称" autocomplete="off">
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="confirmRename()">确定</button>
      </div>
    </div>
  </div>

  <div class="modal" id="newFolderModal">
    <div class="modal-content">
      <h3>新建文件夹</h3>
      <input type="text" id="newFolderNameInput" placeholder="输入文件夹名称" autocomplete="off">
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeNewFolderModal()">取消</button>
        <button class="btn btn-primary" onclick="createNewFolder()">确定</button>
      </div>
    </div>
  </div>

  <div class="modal" id="symlinkModal">
    <div class="modal-content" style="max-width: 90%; width: 400px;">
      <h3>选择目标文件夹</h3>
      <p style="font-size:12px;color:#666;margin-bottom:10px;">将在所选文件夹下创建指向当前目录的软链接</p>
      <div style="max-height: 300px; overflow-y: auto; border: 1px solid #ddd; border-radius: 6px; padding: 8px;" id="symlinkDirTree"></div>
      <div style="margin-top:8px;font-size:12px;color:#888;" id="symlinkSelected">未选择</div>
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeSymlinkModal()">取消</button>
        <button class="btn btn-primary" onclick="createSymlink()">确定</button>
      </div>
    </div>
  </div>

  <script src="/public/js/song_admin.js"></script>
</body>
</html>
