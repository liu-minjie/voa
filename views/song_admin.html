<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>音乐管理</title>
  <link rel="stylesheet" href="/public/css/song_admin.css">
</head>
<body>
  <div class="container">
    <div class="section">
      <div class="search-bar">
        <div class="search-input-wrapper">
          <input type="text" id="searchInput" placeholder="输入文件名搜索..." oninput="handleSearchInput(event)" oncompositionstart="isComposing=true" oncompositionend="handleSearchEnd()">
          <span class="search-clear" id="searchClear" onclick="clearSearch()">×</span>
        </div>
        <button onclick="addSong()">添加</button>
      </div>
      <div class="list-container" id="searchResult"></div>
    </div>

    <div class="section dir-section">
      <div class="dir-nav-wrapper"> 
        <div class="dir-nav" id="dirNav">/</div>
        <div style="position: absolute; top: 2px; right: 5px; display: flex; gap: 6px;">
          <button class="btn btn-primary" id="batchCancelBtn" onclick="cancelBatchSelect()" title="取消选择" style="display:none;">×</button>
          <button class="btn btn-primary" id="batchMoveBtn" onclick="toggleBatchSelect()" title="批量移动">→</button>
          <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()" title="上传文件">↑</button>
          <input type="file" id="fileInput" multiple style="display:none" onchange="handleFileUpload(this)">
          <button class="btn btn-primary" onclick="showSymlinkModal()" title="创建软链接">↷</button>
          <button class="btn btn-primary" onclick="showNewFolderModal()" title="新建文件夹">+</button>
        </div>
      </div>
      
      <div class="list-container" id="dirList">
        <div class="loading">加载中...</div>
      </div>
    </div>

  </div>

</audio>

  <div class="modal" id="renameModal">
    <div class="modal-content">
      <h3 id="modalTitle">重命名</h3>
      <input type="text" id="newNameInput" placeholder="输入新名称" autocomplete="off">
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeRenameModal()">取消</button>
        <button class="btn btn-primary" onclick="confirmRename()">确定</button>
      </div>
    </div>
  </div>

  <div class="modal" id="newFolderModal">
    <div class="modal-content">
      <h3>新建文件夹</h3>
      <input type="text" id="newFolderNameInput" placeholder="输入文件夹名称" autocomplete="off">
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeNewFolderModal()">取消</button>
        <button class="btn btn-primary" onclick="createNewFolder()">确定</button>
      </div>
    </div>
  </div>

  <div class="modal" id="editSongModal">
    <div class="modal-content">
      <h3>编辑歌曲</h3>
      <div style="margin-bottom: 12px;">
        <label style="display:block; margin-bottom:4px; font-size:13px;">歌名</label>
        <input type="text" id="editSongName" placeholder="输入歌名" autocomplete="off" style="width:100%; padding:6px;">
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeEditSongModal()">取消</button>
        <button class="btn btn-primary" onclick="confirmEditSong()">确定</button>
      </div>
    </div>
  </div>

  <div class="modal" id="songListModal">
    <div class="modal-content">
      <div class="songlist-search-bar">
        <input type="text" id="songListSearch" placeholder="搜索歌名..." oninput="filterSongList()">
        <span class="circle-close" onclick="closeSongListModal()">×</span>
      </div>
      <div id="songListContainer">
        <div class="loading">加载中...</div>
      </div>
    </div>
  </div>

  <div class="modal" id="playlistModal">
    <div class="modal-content">
      <span class="circle-close close-playlist" onclick="closePlaylistModal()" >×</span>
      <div style="border: 1px solid #ddd; border-radius: 6px; padding: 8px; flex:1; overflow-y:auto;" id="playlistList"></div>
      <div style="border-top:1px solid #eee;">
        <div id="playlistPlayerContainer"></div>
      </div>
    </div>
  </div>

  <div class="modal" id="metadataModal">
    <div class="modal-content" style="position:relative;">
      <span class="circle-close" onclick="closeMetadataModal()" style="position:absolute; top:15px; right:15px; z-index: 100; cursor: pointer;">×</span>
      <h3>歌曲信息</h3>
      <div id="metadataForm" style="display:flex; flex-direction:column; gap:10px; margin-top:10px;">
        <div style="display:flex; align-items:center;">
          <label style="width:80px; font-size:14px; color:#666;">标题</label>
          <input type="text" id="meta-title" style="flex:1; padding:8px 12px; border:1px solid #ddd; border-radius:4px;">
        </div>
        <div style="display:flex; align-items:center;">
          <label style="width:80px; font-size:14px; color:#666;">艺术家</label>
          <input type="text" id="meta-artist" style="flex:1; padding:8px 12px; border:1px solid #ddd; border-radius:4px;">
        </div>
        <div style="display:flex; align-items:center;">
          <label style="width:80px; font-size:14px; color:#666;">专辑</label>
          <input type="text" id="meta-album" style="flex:1; padding:8px 12px; border:1px solid #ddd; border-radius:4px;">
        </div>
        <div style="display:flex; align-items:center;">
          <label style="width:80px; font-size:14px; color:#666;">流派</label>
          <input type="text" id="meta-genre" style="flex:1; padding:8px 12px; border:1px solid #ddd; border-radius:4px;">
        </div>
        <div style="display:flex; align-items:center;">
          <label style="width:80px; font-size:14px; color:#666;">年份</label>
          <input type="text" id="meta-year" style="flex:1; padding:8px 12px; border:1px solid #ddd; border-radius:4px;">
        </div>
        <div style="display:flex; gap:10px;">
          <div style="display:flex; align-items:center; flex:1;">
            <label style="width:80px; font-size:14px; color:#666;">音轨</label>
            <input type="text" id="meta-track" style="flex:1; padding:8px 12px; border:1px solid #ddd; border-radius:4px;">
          </div>
          <div style="display:flex; align-items:center; flex:1;">
            <label style="width:60px; font-size:14px; color:#666;">碟片</label>
            <input type="text" id="meta-disc" style="flex:1; padding:8px 12px; border:1px solid #ddd; border-radius:4px;">
          </div>
        </div>
      </div>
      <div style="margin-top:15px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <span style="font-size:14px; color:#666; font-weight:500;">自定义信息</span>
          <button class="btn btn-sm" onclick="addCustomInfo()" style="padding:4px 10px; font-size:12px;">+ 添加</button>
        </div>
        <div id="customInfoList" style="display:flex; flex-direction:column; gap:8px;"></div>
      </div>
      <div id="metadataInfo" style="margin-top:15px; padding:10px; background:#f5f5f5; border-radius:4px; font-size:12px; color:#666;"></div>
      <div class="modal-actions" style="margin-top:15px;">
        <button class="btn btn-secondary" onclick="closeMetadataModal()">取消</button>
        <button class="btn btn-primary" onclick="saveMetadata()">保存</button>
      </div>
    </div>
  </div>

  <script src="/public/js/song_admin.js"></script>
</body>
</html>
