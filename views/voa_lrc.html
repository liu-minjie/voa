<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video OCR Dashboard</title>
    <link href="/public/css/icon.css?family=Material+Icons" rel="stylesheet">
    <link href="/public/css/css2.css?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="/public/css/material-components-web.min.css" rel="stylesheet">
    <link href="/public/css/lrc.css" rel="stylesheet">
</head>
<body>

<header>
    <h1 style="margin:0; font-size: 20px;">字幕提取管理后台</h1>
</header>

<div class="main-container">
    <div id="video-list"></div>
</div>

<div class="mdc-dialog" id="roi-dialog">
    <div class="mdc-dialog__container">
        <div class="mdc-dialog__surface">
            <h2 class="mdc-dialog__title">标记字幕区域 - <span id="current-video-title"></span></h2>
            <div class="mdc-dialog__content">
                <div id="roi-container">
                    <video id="roi-video"></video>
                    <canvas id="roi-canvas"></canvas>
                </div>
                <div class="roi-footer" id="coords-display">
                    请使用鼠标在视频上划定字幕范围 (空格暂停/播放)
                </div>
            </div>
            <div class="mdc-dialog__actions">
                <button type="button" class="mdc-button mdc-dialog__button" onclick="closeRoiDialog()">
                    <span class="mdc-button__label">取消</span>
                </button>
                <button type="button" class="mdc-button mdc-button--raised mdc-dialog__button" onclick="submitExtract(this)">
                    <span class="mdc-button__label">提交任务</span>
                </button>
            </div>
        </div>
    </div>
    <div class="mdc-dialog__scrim"></div>
</div>

<script src="/public/js/material-components-web.min.js"></script>
<script>
    const list = {{{list}}};
    const container = document.querySelector('#video-list');

    container.innerHTML = list.map((it) => {
        return `<div class="list-item">
        <span class="video-name">${it}</span>
        <div class="actions">
            <button class="mdc-button mdc-button--outlined" onclick="openRoiDialog(\"${it}\", this)">
                <span class="mdc-button__label">提取字幕</span>
            </button>
            <button class="mdc-button mdc-button--raised" onclick="playVideo(\"${it}\")">
                <span class="mdc-button__label">播放</span>
            </button>
            <button class="mdc-button mdc-button--raised" onclick="renameVideo(\"${it}\", this)">
                <span class="mdc-button__label">重命名</span>
            </button>
        </div>
    </div>`
    }).join('');
</script>
<script src="/public/js/lrc.js"></script>
</body>
</html>
